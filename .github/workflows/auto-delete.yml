name: Auto Delete Repo

on:
  schedule:
    # Pokreće se svakog dana u ponoć UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  delete-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Delete repository
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const createdAt = new Date(context.payload.repository.created_at);
            const now = new Date();
            const hoursDiff = (now - createdAt) / (1000 * 60 * 60);
            
            if (hoursDiff >= 24) {
              await github.rest.repos.delete({
                owner: repo.owner,
                repo: repo.repo
              });
              console.log(`Repository ${repo.repo} je obrisan (starije od 24 sata)`);
            } else {
              console.log(`Repository ${repo.repo} ima ${hoursDiff.toFixed(1)} sati - čeka se brisanje`);
            }
